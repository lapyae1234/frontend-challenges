<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Stats preview card component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      * {
        font-family: "Inter", sans-serif;
        font-optical-sizing: auto;
        font-style: normal;
      }
      .lexend {
        font-family: "Lexend Deca", sans-serif;
        font-optical-sizing: auto;
        font-style: normal;
      }

      @theme {
        --color-Navy-950: hsl(233, 47%, 7%);
        --color-Blue-950: hsl(244, 37%, 16%);
        --color-Purple-500: hsl(277, 64%, 61%);
        --color-White-heading: hsl(0, 0%, 100%);
        --color-White-para: hsla(0, 0%, 100%, 0.75);
        --color-White-stat-heading: hsla(0, 0%, 100%, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-Navy-950 grid place-items-center">
      <div class="max-w-2xl grid md:grid-cols-2">
        <div class="bg-Blue-950 p-7">
          <h2 class="text-xl text-White-heading font-bold">
            Get <span class="text-Purple-500">insights </span> that help your
            business grow.
          </h2>
          <p class="text-xs text-White-para my-2 leading-5">
            Discover the benefits of data analytics and make better decisions
            regarding revenue, customer experience, and overall efficiency.
          </p>
          <div
            class="w-[80%] flex items-center justify-between mt-8 text-White-stat-heading gap-5"
          >
            <div>
              <h3 class="font-bold text-White-heading">10k+</h3>
              <p class="uppercase text-[11px] lexend">companies</p>
            </div>
            <div>
              <h3 class="font-bold text-White-heading">314</h3>
              <p class="uppercase text-[11px] lexend">templates</p>
            </div>
            <div>
              <h3 class="font-bold text-White-heading uppercase">12m+</h3>
              <p class="uppercase text-[11px] lexend">queries</p>
            </div>
          </div>
        </div>

        <div
          class="bg-[url(./images/image-header-desktop.jpg)] bg-cover bg-blend-multiply bg-purple-500 "
        ></div>
      </div>
    </div>
  </body>
</html>
